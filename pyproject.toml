[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "castfetch"
version = "0.1.2"
description = "Make your favorite content searchable. Keep it local."
requires-python = ">=3.11"
dependencies = ["PyYAML>=6,<7"]
license = "MIT"
readme = "README.md"

[project.scripts]
castfetch = "castfetch.cli:main"

[tool.setuptools.packages.find]
include = ["castfetch*"]

[tool.setuptools.package-data]
castfetch = ["worker.py"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
